name: green-aqi-research

services:
  postgres:
    image: postgis/postgis:15-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-green_aqi_research}
      POSTGRES_USER: ${POSTGRES_USER:-green_aqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - research_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  mongo:
    # Orion-LD 1.10 still uses legacy Mongo wire operations removed in MongoDB 6+.
    image: mongo:5.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    environment:
      TZ: UTC
    volumes:
      - research_mongo5_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  orion-ld:
    image: fiware/orion-ld:1.10.0
    restart: unless-stopped
    command: ["-dbhost", "mongo", "-logLevel", "WARN"]
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app
      - data

  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.collector
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-green_aqi_research}
      DB_USER: ${POSTGRES_USER:-green_aqi}
      DB_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      ORION_LD_URL: http://orion-ld:1026/ngsi-ld/v1/entities
      OWM_API_KEY: ${OWM_API_KEY:?Set OWM_API_KEY in deploy/.env}
      RESEARCH_GRID_PATH: config/research-grid.json
      RESEARCH_COLLECTOR_ENABLED: "true"
      AQ_COLLECTION_INTERVAL_MINUTES: ${AQ_COLLECTION_INTERVAL_MINUTES:-15}
      WEATHER_COLLECTION_INTERVAL_MINUTES: ${WEATHER_COLLECTION_INTERVAL_MINUTES:-15}
      COLLECTOR_REQUEST_TIMEOUT_MS: ${COLLECTOR_REQUEST_TIMEOUT_MS:-10000}
      COLLECTOR_MAX_RETRIES: ${COLLECTOR_MAX_RETRIES:-3}
      COLLECTOR_CONCURRENCY: ${COLLECTOR_CONCURRENCY:-2}
      COLLECTOR_BATCH_DELAY_MS: ${COLLECTOR_BATCH_DELAY_MS:-1000}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 3002
      HEALTH_DEPENDENCY_TIMEOUT_MS: ${HEALTH_DEPENDENCY_TIMEOUT_MS:-3000}
      HEALTH_STALE_AFTER_MINUTES: ${HEALTH_STALE_AFTER_MINUTES:-45}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
      orion-ld:
        condition: service_started
    expose:
      - "3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3002/internal/health/research').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - app
      - data

volumes:
  research_postgres_data:
  research_mongo5_data:

networks:
  edge:
    name: green-aqi-edge
    external: true
  app:
    name: green-aqi-app
    external: true
  data:
    name: green-aqi-data
    external: true
